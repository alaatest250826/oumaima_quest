<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لمة لأميمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Markazi+Text:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose-deep:#7a1f3d;
    --rose:#b23a5e;
    --rose-soft:#f2c9d4;
    --cream:#fdf5f2;
    --gold:#c9a24b;
    --ink:#3a1420;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(circle at 50% 0%, #fff8f6 0%, var(--cream) 45%, #f7e3e8 100%);
    color:var(--ink);
    font-family:'Markazi Text', serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:560px;
    text-align:center;
  }

  h1{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:clamp(28px,7vw,42px);
    color:var(--rose-deep);
    line-height:1.4;
  }

  .subtitle{
    margin-top:10px;
    font-size:20px;
    color:#8a5560;
    line-height:1.7;
  }

  /* شاشة البداية */
  #startScreen{
    margin-top:50px;
  }

  .gather-btn{
    font-family:'Aref Ruqaa', serif;
    font-size:24px;
    background:var(--rose-deep);
    color:#fff;
    border:none;
    padding:18px 40px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 16px 34px -16px rgba(122,31,61,0.55);
    transition:transform .18s ease, background .2s ease;
  }
  .gather-btn:hover{background:var(--rose); transform:translateY(-2px);}
  .gather-btn:active{transform:scale(0.97);}

  /* لمة الكلمات */
  #bouquet{
    display:none;
    margin-top:44px;
  }
  #bouquet.show{
    display:block;
    animation:reveal .7s ease;
  }
  @keyframes reveal{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .advice-note{
    font-family:'Aref Ruqaa', serif;
    font-size:19px;
    color:var(--rose-deep);
    line-height:1.9;
    margin-top:18px;
    margin-bottom:26px;
    padding:16px 18px;
    background:#fff0f3;
    border:1px dashed var(--rose);
    border-radius:16px;
  }
  .advice-note p{margin:0;}

  .flowers{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:16px;
    margin-bottom:10px;
  }

  .flower{
    background:#fffdfb;
    border:1px solid var(--rose-soft);
    border-radius:18px;
    padding:20px 14px;
    width:130px;
    cursor:pointer;
    box-shadow:0 14px 30px -20px rgba(122,31,61,0.35);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .flower:hover{
    transform:translateY(-4px);
    border-color:var(--rose);
    box-shadow:0 20px 36px -18px rgba(122,31,61,0.45);
  }
  .flower:active{transform:translateY(-1px) scale(0.98);}

  .flower .icon{
    font-size:26px;
    color:var(--rose);
    margin-bottom:8px;
  }

  .flower .code{
    display:inline-block;
    font-family:'Markazi Text', serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:2px;
    color:var(--gold);
    background:#fbf1e3;
    border:1px solid #e8d3a0;
    border-radius:999px;
    padding:2px 12px;
    margin-bottom:8px;
  }

  .flower .label{
    font-family:'Aref Ruqaa', serif;
    font-size:24px;
    color:var(--rose-deep);
  }

  .flower .hint{
    margin-top:4px;
    font-size:13px;
    color:#c79aa4;
  }

  /* بطاقة الجملة */
  #sentenceCard{
    display:none;
    margin-top:26px;
    background:#fffdfb;
    border:1px solid var(--rose-soft);
    border-radius:20px;
    padding:26px 24px;
    box-shadow:0 20px 44px -24px rgba(122,31,61,0.4);
  }
  #sentenceCard.show{
    display:block;
    animation:reveal .5s ease;
  }

  #sentenceCard .from-word{
    font-family:'Aref Ruqaa', serif;
    font-size:20px;
    color:var(--gold);
    margin-bottom:10px;
  }

  #sentenceCard .sentence{
    font-size:23px;
    line-height:1.8;
    color:var(--ink);
  }

  .signature{
    margin-top:30px;
    font-family:'Aref Ruqaa', serif;
    font-size:24px;
    color:var(--gold);
  }

  .footer-note{
    margin-top:22px;
    font-size:14px;
    color:#c79aa4;
  }
</style>
</head>
<body>

<div class="stage">
  <h1>أميمة هادي ليك يا روحي</h1>
  <p class="subtitle">كليكي هنا مرتي عمري حياتي حبيبي عشقي الخاضعة تاعي المطيعة تاعي كل كلمة فيها جملة و كل جملة عندها معنى</p>

  <div id="startScreen">
    <button class="gather-btn" id="gatherBtn">🌹 دخول عالم علاء</button>
  </div>

  <div id="bouquet">
    <div class="advice-note">
      <p>أنصحك يا أغلى ما أملك أن تحتفظي برموز الكلمات، علاء حبيبك معك</p>
    </div>
    <div class="flowers" id="flowers"></div>
    <div id="sentenceCard">
      <div class="from-word" id="fromWord"></div>
      <div class="sentence" id="sentenceText"></div>
    </div>
  </div>

  <div class="signature">علاء ♥ أميمة</div>
  
</div>

<script>
  const data = {
    "أحبك": [
      "عقلي يخمم فيك في كل وقت",
      "قلبي يهدر بيك في كل وقت",
      "من بين الناس كامل، اخترت نحبك انتِ"
    ],
    "أعشقك": [
      "نعشق حنانك، خضوعك، واستسلامك، ونموت فيهم كي نحسّ بيهم",
      "أنتِ الجنون الحلو ديالي",
      "عشقك زاد فيا، ما نقصش"
    ],
    "أهواك": [
      "هواك ساكن فيا وما يخرجش",
      "كل نفس نتنفسه فيه ريحتك",
      "هواك خلاني نبدل، صرت أحسن بيك"
    ],
    "أدمنتك": [
      "أدمنتك كيما حليب الصباح يا حبيبتي، ما نقدرش نبدا يومي بلاك",
      "صرت عادة ما نقدرش نتخلى عليها",
      "كل ما نبعد عليك، نحس بلي ناقصني شي حاجة"
    ],
    "مرتي": [
      "مرتي، راهي أحلى كلمة نقولها على روحي",
      "نتخيل غير المستقبل، ونلقاك جنبي فيه"
    ],
    "عمري": [
      "عمري كله ليك، من يوم ما عرفتك",
      "معاك الوقت يمشي بسرعة، وبلاك يوقف"
    ],
    "حياتي": [
      "حياتي بدات نهار دخلتِ فيها",
      "كل تفصيلة صغيرة فيك، عزيزة عليا"
    ],
    "عشقي": [
      "عشقي ليك ما عندوش حدود",
      "كل مرة نشوفك، نحس روحي جديدة"
    ],
    "الخاضعة تاعي": [
      "خضوعك ليا أحلى هدية، ونحافظ عليها بكل غيرة",
      "ثقتك فيا كنز، ما نضيعوش"
    ],
    "المطيعة تاعي": [
      "طاعتك ما هي ضعف، هي ثقة كبيرة نقدرها بزاف",
      "كل حاجة نديرها معاك، نديرها بحب لا بأمر"
    ]
  };

  const icons = {
    "أحبك": "♥",
    "أعشقك": "✦",
    "أهواك": "❀",
    "أدمنتك": "☾",
    "مرتي": "☙",
    "عمري": "✧",
    "حياتي": "❁",
    "عشقي": "✿",
    "الخاضعة تاعي": "♡",
    "المطيعة تاعي": "❃"
  };

  const codes = {};
  (function assignRandomCodes(){
    const used = new Set();
    Object.keys(data).forEach(word => {
      let n;
      do {
        n = Math.floor(Math.random() * 999) + 1;
      } while (used.has(n));
      used.add(n);
      codes[word] = String(n).padStart(3, '0');
    });
  })();

  const gatherBtn = document.getElementById('gatherBtn');
  const startScreen = document.getElementById('startScreen');
  const bouquet = document.getElementById('bouquet');
  const flowersEl = document.getElementById('flowers');
  const sentenceCard = document.getElementById('sentenceCard');
  const fromWord = document.getElementById('fromWord');
  const sentenceText = document.getElementById('sentenceText');

  const seenIndex = {};

  gatherBtn.addEventListener('click', () => {
    startScreen.style.display = 'none';
    bouquet.classList.add('show');
  });

  Object.keys(data).forEach(word => {
    seenIndex[word] = 0;
    const div = document.createElement('div');
    div.className = 'flower';
    div.innerHTML = `
      <div class="code">${codes[word]}</div>
      <div class="icon">${icons[word]}</div>
      <div class="label">${word}</div>
      <div class="hint">اضغط هنا</div>
    `;
    div.addEventListener('click', () => {
      const sentences = data[word];
      const idx = seenIndex[word] % sentences.length;
      fromWord.textContent = word;
      sentenceText.textContent = sentences[idx];
      seenIndex[word]++;

      sentenceCard.classList.remove('show');
      void sentenceCard.offsetWidth;
      sentenceCard.classList.add('show');
      sentenceCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    flowersEl.appendChild(div);
  });
</script>

</body>
</html>
