<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Oumaima, do you love me? 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600;1,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush-1:#fff0f4;
    --blush-2:#ffd9e4;
    --rose:#ff5d8f;
    --rose-deep:#c72c5c;
    --plum:#3d1330;
    --cream:#fff8fa;
    --gold:#f4c05e;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 20% 20%, var(--blush-1), transparent 55%),
      radial-gradient(circle at 80% 80%, var(--blush-2), transparent 55%),
      linear-gradient(160deg, #fff0f4, #ffe3ec 60%, #ffd6e3);
    font-family:'Quicksand', sans-serif;
    color:var(--plum);
    min-height:100vh;
  }

  /* floating hearts background */
  .heart-field{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .bg-heart{
    position:absolute;
    bottom:-10%;
    opacity:.35;
    animation:floatUp linear infinite;
    color:var(--rose);
    filter: drop-shadow(0 0 6px rgba(255,93,143,.25));
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:.4; }
    90%{ opacity:.25; }
    100%{ transform:translateY(-115vh) rotate(25deg); opacity:0; }
  }

  main{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:560px;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.8);
    border-radius:28px;
    padding:52px 40px 44px;
    text-align:center;
    box-shadow:
      0 30px 60px -20px rgba(199,44,92,.35),
      0 0 0 1px rgba(255,255,255,.4) inset;
    transition:transform .5s ease;
  }

  .eyebrow{
    display:inline-block;
    font-size:12.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--rose-deep);
    font-weight:700;
    margin-bottom:14px;
    opacity:.85;
  }

  h1{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(30px, 6vw, 46px);
    line-height:1.15;
    margin:0 0 10px;
    color:var(--rose-deep);
  }

  .sub{
    font-size:15.5px;
    color:#7a4258;
    margin:0 0 34px;
    line-height:1.5;
  }

  .buttons{
    position:relative;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    min-height:130px;
  }

  #idkBtn{
    background:#fff;
    color:var(--rose-deep);
    border:2px solid var(--gold);
    transition:transform .2s ease, background .2s ease;
  }
  #idkBtn:hover{
    background:var(--gold);
    color:#4a2e0a;
    transform:translateY(-2px);
  }

  .idk-answer{
    display:none;
    margin-top:20px;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
    color:var(--rose-deep);
    background:rgba(255,255,255,.7);
    border:1.5px dashed var(--gold);
    border-radius:16px;
    padding:14px 18px;
  }
  .idk-answer.show{
    display:block;
    animation:pop .5s ease;
  }

  button{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:17px;
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:16px 38px;
    letter-spacing:.02em;
  }

  #yesBtn{
    background:linear-gradient(135deg, var(--rose), var(--rose-deep));
    color:#fff;
    box-shadow:0 12px 26px -8px rgba(199,44,92,.65);
    transition:transform .4s cubic-bezier(.22,1,.36,1), box-shadow .25s ease;
  }
  #yesBtn:hover{
    transform:translateY(-2px) scale(1.04);
    box-shadow:0 16px 30px -8px rgba(199,44,92,.75);
  }
  #yesBtn.grow{
    transform:scale(1.15);
  }

  #noBtn{
    background:#fff;
    color:var(--rose-deep);
    border:2px solid var(--blush-2);
    position:relative;
    transition: left .45s cubic-bezier(.22,1,.36,1), top .45s cubic-bezier(.22,1,.36,1), transform .3s ease;
    will-change: left, top;
  }
  #noBtn.fleeing{
    position:fixed;
    z-index:50;
  }

  .hint{
    margin-top:26px;
    font-size:15px;
    font-weight:800;
    color:var(--rose-deep);
    min-height:18px;
    transition:opacity .3s ease;
    animation: blinkHint 1s steps(1) infinite;
  }

  @keyframes blinkHint{
    0%, 49%{ opacity:1; }
    50%, 100%{ opacity:.25; }
  }

  @media (prefers-reduced-motion: reduce){
    .hint{ animation:none; }
  }

  /* ---- reveal (yes) state ---- */
  .reveal{
    display:none;
    animation:fadeUp .6s ease both;
  }
  .reveal.show{ display:block; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .stamp{
    font-size:44px;
    margin-bottom:6px;
    display:inline-block;
    animation:pop .5s ease;
  }
  @keyframes pop{
    0%{ transform:scale(0.4) rotate(-8deg); opacity:0; }
    60%{ transform:scale(1.12) rotate(3deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); }
  }

  .reveal h2{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:24px;
    color:var(--rose-deep);
    margin:6px 0 18px;
  }

  .date-wrap{
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:center;
  }

  label.field-label{
    font-size:13px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--rose-deep);
    opacity:.8;
  }

  input[type="date"]{
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:16px;
    padding:12px 18px;
    border-radius:14px;
    border:2px solid var(--blush-2);
    background:#fff;
    color:var(--plum);
    width:220px;
    text-align:center;
  }
  input[type="date"]:focus{
    outline:none;
    border-color:var(--rose);
  }

  #confirmBtn{
    margin-top:6px;
    background:linear-gradient(135deg, var(--gold), #e8a13c);
    color:#4a2e0a;
    box-shadow:0 10px 22px -8px rgba(232,161,60,.6);
    transition:transform .2s ease;
  }
  #confirmBtn:hover{ transform:translateY(-2px); }

  .certificate{
    display:none;
    margin-top:22px;
    padding:20px 18px;
    border-radius:18px;
    border:1.5px dashed var(--rose);
    background:rgba(255,255,255,.7);
  }
  .certificate.show{ display:block; animation:fadeUp .5s ease both; }
  .certificate p{
    margin:0;
    font-size:14.5px;
    color:#7a4258;
  }
  .certificate .big-date{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:22px;
    color:var(--rose-deep);
    margin-top:6px;
  }

  .certificate .rtl-note{
    margin-top:14px;
    font-size:16px;
    font-weight:600;
    color:var(--rose-deep);
    font-family:'Quicksand', sans-serif;
  }

  /* confetti hearts */
  .confetti-heart{
    position:fixed;
    top:-5%;
    z-index:60;
    pointer-events:none;
    animation:confettiFall 2.6s ease-in forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(105vh) rotate(360deg); opacity:0; }
  }

  @media (max-width:480px){
    .card{ padding:40px 22px 34px; }
    .buttons{ flex-wrap:wrap; }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-heart, .confetti-heart{ animation:none !important; display:none; }
    #noBtn{ transition:none; }
  }
</style>
</head>
<body>

<div class="heart-field" id="heartField"></div>

<main>
  <div class="card" id="card">

    <div id="question">
      <span class="eyebrow">Pour Oumaima</span>
      <h1>Oumaima, do you love me?</h1>
      <p class="sub" dir="rtl">اختاري يا أميمة الأميرة</p>

      <div class="buttons" id="buttonsWrap">
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <button id="idkBtn" onclick="sayIdk()">I don't know</button>
        <button id="noBtn">No</button>
      </div>

      <p class="hint" id="hint" dir="rtl"></p>

      <div class="idk-answer" id="idkAnswer" dir="rtl">لماذا تتهربين يا حبيبتي 💗</div>
    </div>

    <div class="reveal" id="revealBlock">
      <span class="stamp">💖</span>
      <h2>Wa9tach twali l dar, twahachtak ana 💗</h2>

      <div class="date-wrap" id="dateStep">
        <label class="field-label" for="kissDate" dir="rtl">اختاري تاريخ العودة الى المنزل يا شاطرة</label>
        <input type="date" id="kissDate">
        <button id="confirmBtn" onclick="confirmDate()">Valider</button>
      </div>

      <div class="certificate" id="certificate">
        <p>C'est officiel. Rendez-vous pris pour le</p>
        <div class="big-date" id="bigDate"></div>
        <p class="rtl-note" dir="rtl">ديري كابتور و ابعتيها لعلاء فالأنسطا 📸💌</p>
      </div>
    </div>

  </div>
</main>

<script>
  /* ---------- always start fresh: force reload if restored from bfcache ---------- */
  window.addEventListener('pageshow', function(e){
    if(e.persisted){
      window.location.reload();
    }
  });

  /* ---------- floating background hearts ---------- */
  const heartField = document.getElementById('heartField');
  const heartChars = ['💗','💕','💞','💓','♥'];
  function spawnBgHeart(){
    const h = document.createElement('span');
    h.className = 'bg-heart';
    h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (14 + Math.random()*22) + 'px';
    h.style.animationDuration = (7 + Math.random()*8) + 's';
    heartField.appendChild(h);
    setTimeout(()=>h.remove(), 16000);
  }
  setInterval(spawnBgHeart, 500);
  for(let i=0;i<10;i++) setTimeout(spawnBgHeart, i*300);

  /* ---------- fleeing "No" button ---------- */
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const hint = document.getElementById('hint');
  let dodges = 0;
  const dodgeMessages = [
    "تحشميش نتي علاه تسيي تكليكي على No ؟",
    "أواه نتي وقيل متحشميش صح اصبري نبعت لعلاء نبيعلو"
  ];

  function fleeNo(e){
    dodges++;
    const btnRect = noBtn.getBoundingClientRect();
    const w = btnRect.width, h = btnRect.height;
    const margin = 12;
    const maxX = window.innerWidth - w - margin;
    const maxY = window.innerHeight - h - margin;

    noBtn.classList.add('fleeing');
    const newX = Math.max(margin, Math.random()*maxX);
    const newY = Math.max(margin, Math.random()*maxY);
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';

    // yes button grows a little each time, because obviously
    const scale = Math.min(1.5, 1 + dodges*0.03);
    yesBtn.style.transform = `scale(${scale})`;

    if(dodges <= 2){
      hint.textContent = dodgeMessages[0];
    } else {
      hint.textContent = dodgeMessages[1];
    }
  }

  noBtn.addEventListener('mouseenter', fleeNo);
  noBtn.addEventListener('touchstart', function(e){ e.preventDefault(); fleeNo(e); }, {passive:false});
  noBtn.addEventListener('click', function(e){
    // just in case it ever gets touched, it still refuses
    e.preventDefault();
    fleeNo(e);
  });

  // proximity dodge: react a bit before the cursor actually touches it, so the motion feels fluid
  let lastDodgeTime = 0;
  document.addEventListener('mousemove', function(e){
    const rect = noBtn.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    const threshold = Math.max(rect.width, rect.height) * 0.9;
    const now = performance.now();
    if(dist < threshold && now - lastDodgeTime > 480){
      lastDodgeTime = now;
      fleeNo(e);
    }
  });

  /* ---------- I don't know flow ---------- */
  function sayIdk(){
    const answer = document.getElementById('idkAnswer');
    answer.classList.add('show');
    burstConfetti(10);
    yesBtn.classList.add('grow');
    yesBtn.style.transform = 'scale(1.35)';
  }

  /* ---------- Yes flow ---------- */
  function sayYes(){
    burstConfetti();
    document.getElementById('question').style.display = 'none';
    const reveal = document.getElementById('revealBlock');
    reveal.classList.add('show');
  }

  function confirmDate(){
    const val = document.getElementById('kissDate').value;
    if(!val){
      document.getElementById('kissDate').style.borderColor = 'var(--rose-deep)';
      return;
    }
    const d = new Date(val + 'T00:00:00');
    const formatted = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    document.getElementById('bigDate').textContent = formatted;
    document.getElementById('certificate').classList.add('show');
    document.getElementById('dateStep').style.opacity = '0.55';
    document.getElementById('dateStep').style.pointerEvents = 'none';
    burstConfetti(14);
  }

  function burstConfetti(count){
    count = count || 24;
    const emojis = ['💖','💕','💗','✨','💞'];
    for(let i=0;i<count;i++){
      const c = document.createElement('span');
      c.className = 'confetti-heart';
      c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      c.style.left = Math.random()*100 + 'vw';
      c.style.fontSize = (16 + Math.random()*20) + 'px';
      c.style.animationDelay = (Math.random()*0.4) + 's';
      c.style.animationDuration = (2 + Math.random()*1.4) + 's';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 4000);
    }
  }

  // sensible default min date = today
  document.getElementById('kissDate').min = new Date().toISOString().split('T')[0];
</script>

</body>
</html>
